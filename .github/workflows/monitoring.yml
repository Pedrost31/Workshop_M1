name: Monitoring

on:
  push:
    branches: [main, master, feat/ci-cd]
    paths:
      - "prometheus/**"
      - "alertmanager/**"
      - "grafana/**"
      - ".github/workflows/monitoring.yml"
  pull_request:
    paths:
      - "prometheus/**"
      - "alertmanager/**"
      - "grafana/**"
      - ".github/workflows/monitoring.yml"

concurrency:
  group: monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prometheus:
    name: Promtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check config
        run: |
          docker run --rm \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            promtool check config /etc/prometheus/prometheus.yml
      - name: check rules
        run: |
          docker run --rm \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            promtool check rules /etc/prometheus/alert.rules.yml

  alertmanager:
    name: Alertmanager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check-config
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml

  grafana:
    name: Dashboard JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON valide
        run: python -m json.tool grafana/dashboards/yanshee.json > /dev/null
