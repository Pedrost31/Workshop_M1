name: Validate

# Contrôle léger et SANS SECRET, exécuté sur chaque pull request et sur les
# branches de travail. Il vérifie que le code s'importe et que les tests se
# collectent (pas d'exécution réelle, pas d'accès à l'instance EV Observe).
#
# C'est le garde-fou qualité des contributions (alternants inclus) : une PR peut
# être validée sans aucun identifiant. L'exécution réelle se fait via le workflow
# « Smoke » sur main / à la demande.

on:
  pull_request:
  push:
    branches-ignore: [main]

# Annule un run précédent encore en cours sur la même branche/PR.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate test collection (no execution, no secrets)
        run: python -m pytest --collect-only -q
